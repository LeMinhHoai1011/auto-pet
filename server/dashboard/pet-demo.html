<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhận dạng chó mèo · Pet Feeder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101c19; color: #f2faf5; font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(1040px, 100% - 32px); margin: 40px auto; }
    a { color: #9de8bb; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; margin: 28px 0 12px; }
    p { color: #c1d6cb; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0; }
    button, input::file-selector-button { cursor: pointer; font: inherit; padding: 9px 14px; border: 1px solid #8db4a0; border-radius: 8px; color: #f2faf5; background: #223c33; }
    #start { color: #10251a; background: #9de8bb; border-color: transparent; font-weight: 700; }
    button:disabled, input:disabled { opacity: .5; cursor: default; }
    input { max-width: 100%; color: inherit; font: inherit; }
    :focus-visible { outline: 3px solid #f5d789; outline-offset: 3px; }
    .preview { display: grid; place-items: center; min-height: 230px; border: 1px solid #456459; border-radius: 16px; overflow: hidden; background: #172a23; }
    canvas { display: block; max-width: 100%; height: auto; }
    canvas[hidden] { display: none; }
    #result { min-height: 1.6em; font-weight: 650; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <script defer src="pet-demo.js"></script>
</head>
<body>
  <main>
    <a href="./">Pet Feeder</a>
    <h1>Nhận dạng chó mèo</h1>
    <p>Dùng webcam hoặc chọn ảnh để xem khung phát hiện và độ tin cậy. Hình ảnh được xử lý trong trình duyệt.</p>
    <div class="controls">
      <button id="start" type="button">Bật webcam</button>
      <button id="stop" type="button" disabled>Dừng webcam</button>
      <label>Chọn ảnh <input id="file" type="file" accept="image/*"></label>
    </div>
    <p id="status" role="status">Chọn nguồn hình để bắt đầu.</p>
    <div class="preview">
      <p id="placeholder">Khung hình sẽ xuất hiện ở đây.</p>
      <canvas id="preview" aria-label="Khung phát hiện chó mèo" hidden></canvas>
    </div>
    <p id="result"></p>
    <video id="camera" muted playsinline hidden></video>
  </main>
</body>
</html>
